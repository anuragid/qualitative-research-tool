name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  alembic-drift-check:
    name: Alembic Migration Drift Gate
    runs-on: ubuntu-latest
    # Must run against real Postgres — JSONB/UUID/ARRAY types require it.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Stub values — only DATABASE_URL is exercised by this job.
      REDIS_URL: redis://localhost:6379/0
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_ENDPOINT_URL: https://ci.r2.cloudflarestorage.com
      R2_BUCKET_NAME: ci
      OPENROUTER_API_KEY: ci
      ASSEMBLYAI_API_KEY: ci
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply all migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Assert single migration head
        # Fails if someone accidentally created a branch in the migration chain.
        run: |
          HEAD_COUNT=$(alembic heads 2>&1 | grep -c "(head)" || true)
          echo "Migration heads found: $HEAD_COUNT"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 alembic head, found $HEAD_COUNT"
            alembic heads
            exit 1
          fi
          echo "OK: single head confirmed"

      - name: Check model-vs-migration drift
        # Runs alembic autogenerate check and fails on any NEW drift not listed
        # in scripts/ci/known_schema_drift.txt.
        #
        # KNOWN DRIFT: scripts/ci/known_schema_drift.txt currently lists the 7
        # missing indexes plus 5 minor schema mismatches (nullable/type/constraint).
        # These are tolerated here and must be resolved by Wave-2 PR W2-A which
        # adds the index migration.  Once W2-A merges, that file must be emptied.
        run: python3 ../scripts/ci/check_migration_drift.py

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Security audit: fail on critical vulns, warn on high.
      # We use --audit-level=critical (Option C) rather than removing
      # continue-on-error entirely (Option A) because npm audit frequently
      # flags high-severity advisories in transitive dependencies that
      # cannot be fixed without upstream patches, causing flaky CI.
      # Critical vulnerabilities are actively exploitable and must block merges.
      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      # The vitest storybook project runs in real Chromium via
      # @vitest/browser-playwright (see frontend/vite.config.ts).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (vitest)
        run: npm test -- --run

      - name: Build (includes typecheck)
        run: npm run build

  deploy-frontend:
    name: Deploy Frontend
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with production env
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PROXY_URL: ${{ secrets.VITE_CLERK_PROXY_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify no test keys in build
        run: |
          if grep -r --include='*.js' --include='*.html' 'pk_test_Zm' dist/; then
            echo "ERROR: Build contains test Clerk key!"
            exit 1
          fi

      - name: Verify no dev bypass in build
        run: |
          if grep -r --include='*.js' --include='*.html' 'dev-bypass' dist/; then
            echo "ERROR: Build contains dev-bypass token!"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=methodex-frontend --branch=main --commit-dirty=true
          workingDirectory: frontend

  # NOTE: There is deliberately NO "wait for Railway deploy" job in this workflow.
  #
  # Railway's "Wait for CI" gate (checkSuites=true on the deployment trigger,
  # set via `python3 scripts/railway-service-config.py --apply`) holds the
  # Railway deployment in WAITING until every check suite on the pushed commit
  # concludes. A job in THIS workflow that polls for the Railway deployment
  # would deadlock: the deployment cannot start until this check suite
  # completes, and the suite cannot complete while a job is waiting for the
  # deployment. Every main push would hang ~10 minutes and go red.
  #
  # Post-deploy failure handling lives on the Railway side instead:
  # healthcheck on /health/ready + ON_FAILURE restart policy (railway.toml).
  # Manual verification tool: scripts/ci/wait-for-railway-deploy.py (run
  # locally, never from this workflow).
  # See docs/production-readiness/runbooks/deploy-gating.md.
