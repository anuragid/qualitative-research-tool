services:
  # PostgreSQL - local dev (mirrors Railway Postgres)
  postgres:
    image: postgres:15-alpine
    container_name: qualitative-research-db
    environment:
      POSTGRES_DB: qualitative_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualitative-network

  # Redis - local dev (mirrors Railway Redis)
  redis:
    image: redis:7-alpine
    container_name: qualitative-research-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualitative-network

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.railway
    container_name: qualitative-research-api
    env_file:
      - ./backend/.env.docker-local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - qualitative-network
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - SERVICE_TYPE=api

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.railway
    container_name: qualitative-research-worker
    env_file:
      - ./backend/.env.docker-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qualitative-network
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - SERVICE_TYPE=worker
    command: ["worker"]

networks:
  qualitative-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
