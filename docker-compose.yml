# SECURITY NOTE: In production (Railway), database and Redis should use
# private networking (*.railway.internal) to prevent public exposure.
# The ports exposed here are for local development only.
services:
  # PostgreSQL - local dev (mirrors Railway Postgres)
  postgres:
    image: postgres:15-alpine
    container_name: qualitative-research-db
    environment:
      POSTGRES_DB: qualitative_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualitative-network

  # Redis - local dev (mirrors Railway Redis)
  redis:
    image: redis:7-alpine
    container_name: qualitative-research-redis
    command: redis-server --requirepass devredispass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devredispass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualitative-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.railway
    container_name: qualitative-research-api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - qualitative-network
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - SERVICE_TYPE=api
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/qualitative_research
      - REDIS_URL=redis://:devredispass@redis:6379/0

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.railway
    container_name: qualitative-research-worker
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qualitative-network
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - SERVICE_TYPE=worker
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/qualitative_research
      - REDIS_URL=redis://:devredispass@redis:6379/0
    command: ["worker"]

networks:
  qualitative-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
